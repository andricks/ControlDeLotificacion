[project]
name = "sistema-documental"
version = "0.1.0"
description = "API de promesas de compra-venta, recibos de caja y documentos PDF"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "beanie>=2.0",
    "pymongo>=4.13",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permitir tildes/ñ en textos y comentarios

[tool.ruff.lint.per-file-ignores]
"**/models.py" = ["RUF012"]  # `class Settings: indexes = [...]` es la convención de Beanie

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "atlas: requiere conexión real a MongoDB Atlas (se omite si no hay MONGODB_URI)",
    "lento: pruebas lentas (OCR, PDFs grandes)",
]
